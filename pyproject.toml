[project]
name = "lmft-school"
version = "0.1.0"
description = "Developmental training project attempting to formalize human interface firmware architecture for language model reality compatibility"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "scikit-fuzzy==0.5.0",
    "networkx==3.6.1",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

# No distribution build backend yet; pytest imports directly from src.
# Use requirements-dev.txt to reproduce direct AND transitive dependencies.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
